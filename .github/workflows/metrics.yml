name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"     # 每天 UTC 0 點執行
  workflow_dispatch:          # 允許手動執行

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 允許 push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # 解決 Fetching submodules 卡住的問題

      # 以下各步驟產生不同的 SVG
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          filename: Images/github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Full-year isometric calendar
        uses: lowlighter/metrics@latest
        with:
          filename: Images/metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Half-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: Images/metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes

      - name: Full history calendar
        uses: lowlighter/metrics@latest
        with:
          filename: Images/metrics.plugin.calendar.full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0

      - name: Recently starred
        uses: lowlighter/metrics@latest
        with:
          filename: Images/metrics.plugin.stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 3

      - name: Self introduction card
        uses: lowlighter/metrics@latest
        with:
          filename: Images/metrics.plugin.introduction.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header
          plugin_introduction: yes

      # 重點：將產生的 SVG 提交並推送回倉庫
      - name: Commit and push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Images/*.svg
          git diff --staged --quiet || git commit -m "Update metrics"
          git remote set-url origin https://x-access-token:${{ secrets.METRICS_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:${GITHUB_REF_NAME}
